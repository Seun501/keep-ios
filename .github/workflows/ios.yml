# 打包机（CI）。两班：
#   build   ——每次推代码：造工程、编模拟器版（不签名）、起模拟器截一张图存成产物。验「编得过、跑得起」。
#   testflight——手动点或推 v* 标签：真机归档+云签名+直传 TestFlight。要四个仓库密钥（见 README）。
# 私有仓库 macOS 分钟按 10 倍计，所以 build 班只在 Sources/配置改动时跑，README 之类不触发。
name: iOS

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Resources/**"
      - "project.yml"
      - "ExportOptions.plist"
      - ".github/workflows/ios.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "归档并上传 TestFlight"
        type: boolean
        default: false
      screens:
        description: "截图班要截的页（空格分隔）；macOS 分钟按十倍计费，只截要看的"
        type: string
        default: "chat drawer board boardpop boardreply greet"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Keep
  SIM_NAME: iPhone 17     # 打包机 Xcode 26.6 的模拟器清单只有 17 系（09-02 实测）

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event.inputs.testflight != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 工具与版本
        run: |
          brew install xcodegen
          xcodebuild -version
          xcrun simctl list runtimes | head -20

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（模拟器，不签名）
        run: |
          set -o pipefail
          xcodebuild -project Keep.xcodeproj -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -60

      - name: 模拟器截图
        run: |
          set -e
          UDID=$(xcrun simctl list devices available | grep "$SIM_NAME (" | head -1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "sim=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/DerivedData -name "Keep.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p artifacts
          # 预览模式：假对话，不登录不联网；每页起一次、等 7 秒、截一张（只截 screens 里点名的页）
          SCREENS="${{ github.event.inputs.screens }}"; [ -z "$SCREENS" ] && SCREENS="chat drawer board boardpop boardreply greet"
          for SCREEN in $SCREENS; do
            SIMCTL_CHILD_KEEP_PREVIEW=1 SIMCTL_CHILD_KEEP_SCREEN=$SCREEN xcrun simctl launch --terminate-running-process "$UDID" cn.seunk.keep
            sleep 7
            xcrun simctl io "$UDID" screenshot "artifacts/$SCREEN.png"
          done
          # 踩坑册：别信界面，看包。把最终 Info.plist 与授权一并留证。
          plutil -p "$APP/Info.plist" > artifacts/Info.plist.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sim-${{ github.run_number }}
          path: artifacts/
          retention-days: 7

  testflight:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.testflight == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 工具
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: 落 App Store Connect 密钥
        run: |
          mkdir -p "$HOME/private_keys"
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # 手动签名（09-02 定）：自动签名要团队里至少登记一台设备才肯出开发描述文件，我们没线也没 Mac；
      # 发行证书与 App Store 描述文件由 API 直接申请，打包机每次现装进临时钥匙串。
      - name: 装签名证书与描述文件
        env:
          KC_PW: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -e
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          # Apple 中间证书（签发链 WWDR G3；G4–G6 一并备着，下不到不算错）
          for g in G3 G4 G5 G6; do
            curl -fsSL "https://www.apple.com/certificateauthority/AppleWWDRCA${g}.cer" -o "$RUNNER_TEMP/wwdr$g.cer" \
              && security import "$RUNNER_TEMP/wwdr$g.cer" -k "$KC" -T /usr/bin/codesign >/dev/null 2>&1 || true
          done
          echo "${{ secrets.DIST_P12_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "${{ secrets.DIST_P12_PASSWORD }}" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security find-identity -v -p codesigning "$KC"
          # 描述文件：Xcode 16+ 与旧路径各放一份，按 UUID 命名
          echo "${{ secrets.APPSTORE_PROFILE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/keep.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/keep.mobileprovision" | plutil -extract UUID raw -o - -)
          echo "profile uuid=$UUID"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/keep.mobileprovision" "$d/$UUID.mobileprovision"
          done
          rm -f "$RUNNER_TEMP/dist.p12"

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 归档（真机，手动签名）
        run: |
          set -o pipefail
          xcodebuild -project Keep.xcodeproj -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath build/Keep.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Keep AppStore" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -80

      - name: 查包（踩坑册：看包不看界面）
        run: |
          APP=$(find build/Keep.xcarchive/Products -name "Keep.app" | head -1)
          plutil -p "$APP/Info.plist"
          codesign -d --entitlements - "$APP" 2>&1 | head -40

      - name: 导出并上传 TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Keep.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -60

      - name: 抹密钥
        if: always()
        run: |
          rm -rf "$HOME/private_keys" "$RUNNER_TEMP/keep.mobileprovision"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
