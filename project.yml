# XcodeGen 项目描述——打包机上 `xcodegen generate` 现造 .xcodeproj，仓库里不存 Xcode 工程文件。
# 没有 Mac 的前提下，工程配置全在这一份文本里，改动可读可审。
name: Keep
options:
  bundleIdPrefix: cn.seunk
  deploymentTarget:
    iOS: "16.4"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # 团队号由打包机环境变量注入（见 .github/workflows/ios.yml），仓库里不写死。
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Keep:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    # 显式 Info.plist：踩坑册 00 章——INFOPLIST_KEY_* 自动生成会把 UIBackgroundModes 等键悄悄丢掉。
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Keep
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        # 健康原生化（09-08 寻定）：读健康库直推网关，取代快捷指令；位置只在推的时候取一次给天气
        NSHealthShareUsageDescription: Keep 读取你的睡眠、心率、步数等，只推给你自己的网关，不经第三方。
        NSHealthUpdateUsageDescription: Keep 不写入健康数据。
        NSLocationWhenInUseUsageDescription: 同步健康数据时取一次位置给天气用；「常去的地方」记下这里时取一次精确定位。
        # 09-10 寻定「位置」：地理围栏要「始终」——到了/离开常去的地方，手机在包里也能报到
        NSLocationAlwaysAndWhenInUseUsageDescription: 选「始终」，到了或离开你记下的常去的地方时，Keep 才能在后台向你自己的网关报一声。只报地方的名字，不上传轨迹。
        # 09-09 寻定「克能实时查健康」：网关发静默推送把 Keep 叫醒读一份快照——没有这键静默推送不送到
        UIBackgroundModes:
          - remote-notification
        UIAppFonts:
          - NotoSerifSC-Regular.otf
          - NotoSerifSC-Medium.otf
          - NotoSerifSC-SemiBold.otf
          - NotoSerifSC-Bold.otf
          - Lora.ttf
    entitlements:
      path: Keep.entitlements
      properties:
        aps-environment: production      # 推送；TestFlight/App Store 包一律 production
        com.apple.developer.healthkit: true                       # 09-08：App ID 已由 API 加 HEALTHKIT 能力、描述文件重做
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true   # 新样本落库时后台叫醒（解锁后才读得到）
    dependencies:
      - sdk: HealthKit.framework
      - sdk: CoreLocation.framework
      - sdk: MapKit.framework
      - sdk: WatchConnectivity.framework
      - target: KeepWatch                  # 手表端随手机包一起装（Embed Watch Content）
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.seunk.keep
        TARGETED_DEVICE_FAMILY: "1"          # 只做 iPhone（项目级写法被目标级默认盖掉，09-02 查包发现）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        # 描述文件按目标各一份（09-10 加手表端后不能再在命令行统一指定）
        PROVISIONING_PROFILE_SPECIFIER: "Keep AppStore"

  # 手表端（09-10 寻定）：Xcode 14+ 单目标手表 App（没有 WatchKit 扩展那层）。
  # App ID cn.seunk.keep.watchkitapp 与描述文件由 密钥与登录\ios-signing\加手表.py 经 ASC 接口登记。
  KeepWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch/Sources
      - path: Watch/Resources
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Keep
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: cn.seunk.keep
        WKRunsIndependentlyOfCompanionApp: false
        NSHealthShareUsageDescription: Keep 在表上读取你的睡眠、心率、步数等，只推给你自己的网关，不经第三方。
        NSHealthUpdateUsageDescription: Keep 不写入健康数据。
    entitlements:
      path: Watch/KeepWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.seunk.keep.watchkitapp
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
        PROVISIONING_PROFILE_SPECIFIER: "Keep Watch AppStore"
